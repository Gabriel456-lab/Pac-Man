<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man JS Ultra</title>
    <link rel="shortcut icon" href="assets/fanv.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hud">
        <div>
            🎮 Fase: <span id="level">1</span>
        </div>

        <div>
            ⭐ Score: <span id="score">0</span>
        </div>

        <div id="lives">
            ❤️❤️❤️
        </div>

        <div>
            <button id="pauseBtn" title="Pausar/Retomar">⏸️</button>
            <button id="muteBtn" title="Alternar Áudio">🔊</button>
        </div>
    </div>

    <div id="powerContainer">
        <div id="powerBar"></div>
    </div>

    <div id="game"></div>

    <div id="overlay">
        <div id="overlayText">
            <h1>PAC-MAN</h1>
            <p>Pressione o botão para iniciar a caçada!</p>
        </div>
        <br>
        <button id="startBtn">▶ JOGAR</button>
    </div>

    <div id="notification"></div>

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ghosts.js"></script>
    <script src="js/player.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
